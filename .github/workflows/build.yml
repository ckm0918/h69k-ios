name: Build H69KControl IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project H69KControl.xcodeproj \
            -scheme H69KControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          EXIT=${PIPESTATUS[0]}
          echo "=== COMPILE ERRORS ==="
          grep -E "error:|\.swift:[0-9]+:|warning: .*(deprecated|unavailable|'[^']*' is only available)" build.log | head -40 || true
          echo "=== EXIT=$EXIT ==="
          exit $EXIT

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$PWD/build" -name "H69KControl.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD" -name "H69KControl.app" -type d | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r H69KControl-unsigned.ipa Payload
          ls -la H69KControl-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: H69KControl-unsigned-ipa
          path: H69KControl-unsigned.ipa
          if-no-files-found: error
